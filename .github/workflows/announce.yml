name: Release Cycle Announcement

# GitHub cron is UTC-only and does not follow US daylight saving. Firing at both
# 14:00 and 15:00 UTC covers 07:00 Pacific year-round; post_announcement.py gates
# on the real Pacific hour so exactly one of the two runs posts.
on:
  schedule:
    - cron: "0 14 * * 1-4" # 07:00 PDT (summer)
    - cron: "0 15 * * 1-4" # 07:00 PST (winter)
  workflow_dispatch:
    inputs:
      force_day:
        description: "Post a specific day's announcement (Monday-Thursday)"
        required: false
        type: choice
        options: ["", "Monday", "Tuesday", "Wednesday", "Thursday"]
        default: ""
      dry_run:
        description: "Print the payload instead of posting to Teams"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-cycle-announcement
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post announcement
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pin assets to the commit being run so the card never renders a
          # half-updated banner mid-deploy.
          ASSET_REF: ${{ github.sha }}
          FORCE_DAY: ${{ inputs.force_day }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/post_announcement.py
