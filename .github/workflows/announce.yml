name: Release Cycle Announcement

# GitHub cron is UTC-only and does not follow US daylight saving. Firing at both
# 14:00 and 15:00 UTC covers 07:00 Pacific year-round; post_announcement.py gates
# on the real Pacific hour so exactly one of the two runs posts.
on:
  schedule:
    - cron: "0 14 * * 1-4" # 07:00 PDT (summer)
    - cron: "0 15 * * 1-4" # 07:00 PST (winter)
  workflow_dispatch:
    inputs:
      force_day:
        description: "Post a specific day's announcement (Monday-Thursday)"
        required: false
        type: choice
        options: ["", "Monday", "Tuesday", "Wednesday", "Thursday"]
        default: ""
      dry_run:
        description: "Print the payload instead of posting to Teams"
        required: false
        type: boolean
        default: true
      allow_off_day:
        description: "Permit posting a day's card on a different day (normally refused)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-cycle-announcement
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post announcement
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pin assets to the commit being run so the card never renders a
          # half-updated banner mid-deploy.
          ASSET_REF: ${{ github.sha }}
          FORCE_DAY: ${{ inputs.force_day }}
          # -f submits strings, so match both the boolean and the string form.
          # Fails safe: on a manual run, anything unrecognised is a dry run.
          #
          # The truthy branch MUST hold '1', never ''. `a && b || c` returns c
          # whenever b is falsy, and '' is falsy, so `cond && '' || '1'` yields
          # '1' for every input -- which silently made every run a dry run and
          # posted nothing at all. Scheduled runs have no inputs, so they are
          # excluded by event name rather than by testing inputs.dry_run.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run != false && inputs.dry_run != 'false') && '1' || '0' }}
          # Fails safe: only an explicit true permits an off-day post.
          ALLOW_OFF_DAY: ${{ (inputs.allow_off_day == true || inputs.allow_off_day == 'true') && '1' || '' }}
          # Identifies which of the two DST crons fired. Empty on manual runs.
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/post_announcement.py
